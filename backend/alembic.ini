 #
=========================================================================
=====
# TỆP CẤU HÌNH MIGRATION CƠ SỞ DỮ LIỆU ALEMBIC (DỰ ÁN VSICO ZALO BOT)
#
=========================================================================
=====

[alembic]
# Đường dẫn tới thư mục chứa các kịch bản migration.
# %(here)s đại diện cho thư mục hiện tại chứa file alembic.ini này.
script_location = %(here)s/migrations

# Định dạng mẫu đặt tên cho các file migration được sinh ra (mặc định:
<mã_rev>_<tên_ngắn>.py) 
# file_template = %%(rev)s_%%(slug)s

# Thêm thư mục hiện tại vào sys.path của Python để import được module
src.*
prepend_sys_path = .                                                     

# Múi giờ sử dụng khi ghi nhận ngày giờ trong file migration (để trống là
giờ máy chủ)
# timezone = Asia/Ho_Chi_Minh

# Ký tự phân tách đường dẫn hệ điều hành (os.pathsep để chạy tốt cả trên 
Linux và Windows)
path_separator = os

# Bảng mã font chữ khi sinh file migration từ template script.py.mako    
# output_encoding = utf-8

# Chuỗi kết nối Database mặc định.
# LƯU Ý: Dự án này tự động nạp kết nối MySQL thật từ file .env thông qua 
migrations/env.py,
# nên giá trị dưới đây chỉ đóng vai trò giữ chỗ dự phòng.
sqlalchemy.url = 
mysql+pymysql://root:123456@127.0.0.1:3306/vsico_zalo_bot?charset=utf8mb4


#
=========================================================================
=====
# CÁC MÓC TỰ ĐỘNG SAU KHI SINH FILE MIGRATION (POST WRITE HOOKS)
#
=========================================================================
=====
[post_write_hooks]
# Tùy chọn: Tự động chạy Ruff hoặc Black để format code file migration
mới sinh ra
# hooks = ruff
# ruff.type = exec                                                       
# ruff.executable = ruff                                                 
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


#
=========================================================================
=====
# CẤU HÌNH GHI NHẬT KÝ RA TERMINAL (LOGGING CONFIGURATION)
#
=========================================================================
=====
[loggers]
keys = root,sqlalchemy,alembic

[handlers]                                                               
keys = console

[formatters]                                                             
keys = generic                                                           

# Cấu hình log tổng
[logger_root]
level = WARNING                                                          
handlers = console                                                       
qualname =                                                               
                                                                            
# Cấu hình log của SQLAlchemy (chỉ hiện WARNING để đỡ rác màn hình khi   
chạy lệnh)                                                               
[logger_sqlalchemy]                                                      
level = WARNING                                                          
handlers =                                                               
qualname = sqlalchemy.engine                                             
                                                                            
# Cấu hình log của Alembic (hiện INFO để biết đang chạy đến migration    
nào)                                                                     
[logger_alembic]                                                         
level = INFO                                                             
handlers =                                                               
qualname = alembic                                                       
                                                                            
# Cổng xuất log ra Terminal (Mặc định xuất ra standard error)            
[handler_console]                                                        
class = StreamHandler                                                    
args = (sys.stderr,)                                                     
level = NOTSET                                                           
formatter = generic

# Định dạng dòng log hiển thị: [MỨC ĐỘ] [TÊN_LOGGER] Nội dung thông báo  
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
