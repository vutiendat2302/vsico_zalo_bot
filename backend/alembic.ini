# ==============================================================================
# TỆP CẤU HÌNH MIGRATION CƠ SỞ DỮ LIỆU ALEMBIC (DỰ ÁN VSICO ZALO BOT)
# ==============================================================================

[alembic]
# Đường dẫn tới thư mục chứa các kịch bản migration.
script_location = %(here)s/migrations

# Định dạng mẫu đặt tên cho các file migration được sinh ra
# file_template = %%(rev)s_%%(slug)s

# Thêm thư mục hiện tại vào sys.path của Python để import được module src.*
prepend_sys_path = .

# Múi giờ sử dụng khi ghi nhận ngày giờ trong file migration
# timezone = Asia/Ho_Chi_Minh

# Ký tự phân tách đường dẫn hệ điều hành
path_separator = os

# Bảng mã font chữ khi sinh file migration
# output_encoding = utf-8

# Chuỗi kết nối Database mặc định (migrations/env.py nạp từ .env)
sqlalchemy.url = mysql+pymysql://vsico_user:iE9pyNKgQzwPMjNCEoi3MEjtfW8@127.0.0.1:3306/vsico_zalo_bot?charset=utf8mb4

# ==============================================================================
# CÁC MÓC TỰ ĐỘNG SAU KHI SINH FILE MIGRATION (POST WRITE HOOKS)
# ==============================================================================
[post_write_hooks]
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# ==============================================================================
# CẤU HÌNH GHI NHẬT KÝ RA TERMINAL (LOGGING CONFIGURATION)
# ==============================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# Cấu hình log tổng
[logger_root]
level = WARNING
handlers = console
qualname =

# Cấu hình log của SQLAlchemy
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Cấu hình log của Alembic
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Cổng xuất log ra Terminal
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Định dạng dòng log hiển thị
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
