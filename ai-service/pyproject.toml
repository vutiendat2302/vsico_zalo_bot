[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsico-ai-service"
version = "1.0.0"
description = "VSICO AI & OCR Microservice - Đọc hiểu ngữ cảnh hội thoại, bóc tách NLP & Map địa chỉ kho"
readme = "AISERVICE.md"
requires-python = ">=3.10"
authors = [
    { name = "VSICO AI Team", email = "ai@vsico.com.vn" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
